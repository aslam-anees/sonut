<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>atcode</title>
  <style>
    :root {
      color-scheme: dark;
      --knight: #171a20;
      --plate: #20242c;
      --edge: #353b46;
      --steel: #b7bec9;
      --quiet: #7f8997;
      --signal: #aab4c2;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 38%, #2a3039 0, var(--knight) 55%, #101216 100%);
      color: var(--steel);
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    main {
      width: min(88vw, 520px);
      padding: 42px 36px 36px;
      text-align: center;
      background: color-mix(in srgb, var(--plate) 92%, transparent);
      border: 1px solid var(--edge);
      border-radius: 12px;
      box-shadow: 0 18px 55px rgb(0 0 0 / 35%), inset 0 1px rgb(255 255 255 / 4%);
    }
    h1 {
      margin: 0;
      color: var(--signal);
      font-size: clamp(28px, 7vw, 48px);
      font-weight: 500;
      letter-spacing: .18em;
      text-transform: lowercase;
    }
    p { margin: 18px 0 0; color: var(--quiet); }
    code {
      display: inline-block;
      margin-top: 22px;
      padding: 6px 10px;
      color: var(--steel);
      background: #12151a;
      border: 1px solid var(--edge);
      border-radius: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main aria-label="atcode browser idle page">
    <h1>atcode</h1>
    <p>browser ready · waiting for agent activity</p>
    <code>terminal-browser.com</code>
  </main>
</body>
</html>
